version: '3.8'

services:
  # 1. Contenedor de la Aplicación Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: farmacia_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - DB_HOST=host.docker.internal
    volumes:
      - .:/var/www/html
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - farmacia_net

  # 2. Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: farmacia_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - farmacia_net

  # 3. Procesador de Colas (Queue Worker)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: farmacia_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      - DB_HOST=host.docker.internal
    volumes:
      - .:/var/www/html
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    networks:
      - farmacia_net

  # 4. Programador de Tareas Periódicas (Laravel Scheduler)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: farmacia_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: [ "sh", "-c", "while true; do php artisan schedule:run --no-interaction & sleep 60; done" ]
    environment:
      - DB_HOST=host.docker.internal
    volumes:
      - .:/var/www/html
      - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    networks:
      - farmacia_net

networks:
  farmacia_net:
    driver: bridge
